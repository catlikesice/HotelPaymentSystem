<html lang="en">
<head>
    <div class="logo-header">
            <img src="Baltic%20Comfort%20LTD%20logo.png" alt="Baltic Comfort Logo">
        </div>
    <link rel="stylesheet" href="styles.css">
</head>
            <!-- Navigation bar -->
        <nav class="site-nav" aria-label="Primary navigation">
            <div class="nav-inner">
                <a class="brand" href="index.html" title="Home">BalticComfort</a>

                <!-- Minimal, explicit nav: three real anchors inside .nav-containers.
                     These anchors are the clickable boxes and are physically inside the nav. -->
                <div class="nav-containers" role="menubar" aria-label="Site quick links">
                    <a class="nav-box nav-box-left" href="selectlocation.html" role="menuitem" aria-label="Book with us">Book with Us</a>
                    <details class="nav-dropdown" role="none">
                        <summary class="nav-box nav-box-center" role="menuitem" aria-haspopup="true">About the Baltic States</summary>
                        <div class="nav-dropdown-menu" role="menu">
                            <a href="aboutlatvia.html" role="menuitem">About Latvia</a>
                            <a href="aboutestonia.html" role="menuitem">About Estonia</a>
                        </div>
                    </details>
                    <a class="nav-box nav-box-right" href="#contact" role="menuitem" aria-label="Contact us">Contact</a>
                </div>

                <!-- The original link list is kept in the DOM but visually hidden to
                     avoid duplicate visible text while preserving accessibility.
                     (This is a minimal compromise so screen readers keep the list;
                     visual users only see the .nav-box anchors.) -->
                <ul class="nav-links" aria-hidden="true">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="selectlocation.html">Book with Us</a></li>
                    <li><a href="aboutlatvia.html">About Latvia</a></li>
                    <li><a href="aboutestonia.html">About Estonia</a></li>

                </ul>
            </div>

<body class="hero">
    <label for="lang-select" class="sr-only">Language</label>
    <select id="lang-select" aria-label="Select language">
      <option value="en">English</option>
      <option value="ru">Русский</option>
      <option value="lv">Latviešu</option>
      <option value="et">Eesti</option>
    </select>

    <div class="booking-container">
        <h2 id="booking-title">Start Your Booking</h2>

        <form id="bookingForm" class="booking-form-row" onsubmit="return false;">
            <div class="form-inline">
                <label for="country" id="country-label"><b>Select Country:</b></label>
                <select id="country" name="country">
                    <option value="" id="country-placeholder">-- Select Country --</option>
                    <option value="denmark">Denmark</option>
                    <option value="estonia">Estonia</option>
                    <option value="latvia">Latvia</option>
                    <option value="lithuania">Lithuania</option>
                </select>
            </div>
            <div class="form-inline">
                <label for="city" id="city-label"><b>Select City/Town:</b></label>
                <select id="city" name="city" disabled>
                    <option value="" id="city-placeholder">-- Select City/Town --</option>
                </select>
            </div>
        </form>

        <!-- Added: live location display inside the page so the chosen location shows immediately -->
        <p id="selectedLocation" aria-live="polite"></p>
    </div>

    <button id="continueBtn" class="btn continue-btn">Continue</button>

    <script>
    // Translation data for supported languages
    const translations = {
      en: {
        "booking-title": "Start Your Booking",
        "country-label": "Select Country:",
        "country-placeholder": "-- Select Country --",
        "city-label": "Select City/Town:",
        "city-placeholder": "-- Select City/Town --",
        "continueBtn": "Continue",
        "footer-text": "&copy; 2025 BalticComfort. Blockchain solutions for the hospitality industry."
      },
      ru: {
        "booking-title": "Начать бронирование",
        "country-label": "Выберите страну:",
        "country-placeholder": "-- Выберите страну --",
        "city-label": "Выберите город:",
        "city-placeholder": "-- Выберите город --",
        "continueBtn": "Продолжить",
        "footer-text": "&copy; 2025 BalticComfort. Блокчейн-решения для гостиничной индустрии."
      },
      lv: {
        "booking-title": "Sāciet rezervāciju",
        "country-label": "Izvēlieties valsti:",
        "country-placeholder": "-- Izvēlieties valsti --",
        "city-label": "Izvēlieties pilsētu:",
        "city-placeholder": "-- Izvēlieties pilsētu --",
        "continueBtn": "Turpināt",
        "footer-text": "&copy; 2025 BalticComfort. Blokķēdes risinājumi viesmīlības industrijai."
      },
      et: {
        "booking-title": "Alusta broneerimist",
        "country-label": "Vali riik:",
        "country-placeholder": "-- Vali riik --",
        "city-label": "Vali linn:",
        "city-placeholder": "-- Vali linn --",
        "continueBtn": "Jätka",
        "footer-text": "&copy; 2025 BalticComfort. Blockchain-lahendused hotellindusele."
      },
    };

    // On language change, update all translatable elements
    document.getElementById('lang-select').addEventListener('change', function() {
      const lang = this.value;
      const mapping = translations[lang] || translations['en'];
      Object.keys(mapping).forEach(function(key) {
        const el = document.getElementById(key);
        if (el) {
          if (key === "footer-text") {
            el.innerHTML = mapping[key];
          } else {
            el.textContent = mapping[key];
          }
        }
      });
      
      // Update city dropdown placeholder after language change
      const citySelect = document.getElementById('city');
      if (citySelect.options.length === 1 && citySelect.options[0].value === '') {
        citySelect.options[0].text = mapping["city-placeholder"];
      }
    });

        const cities = {
            denmark: ["Copenhagen", "Aarhus", "Odense", "Aalborg", "Esbjerg"],
            estonia: ["Tallinn", "Tartu", "Narva", "Pärnu", "Viljandi"],
            latvia: ["Riga", "Daugavpils", "Liepaja", "Jelgava", "Jurmala"],
            lithuania: ["Vilnius", "Kaunas", "Klaipeda", "Šiauliai", "Panevėžys"]
        };

        const countrySelect = document.getElementById('country');
        const citySelect = document.getElementById('city');
        const continueBtn = document.getElementById('continueBtn');
        const selectedLocation = document.getElementById('selectedLocation');

        function updateLocationDisplay() {
            const countryIndex = countrySelect.selectedIndex;
            const countryText = countryIndex >= 0 ? countrySelect.options[countryIndex].text : '';
            const cityIndex = citySelect.selectedIndex;
            const cityText = cityIndex >= 0 ? citySelect.options[cityIndex].text : '';

            if (countrySelect.value && citySelect.value) {
                selectedLocation.textContent = `Selected location: ${countryText} — ${cityText}`;
            } else if (countrySelect.value) {
                selectedLocation.textContent = `Selected country: ${countryText} (please select a city/town)`;
            } else {
                selectedLocation.textContent = '';
            }
        }

        // Populate city list when country changes and update display
        countrySelect.addEventListener('change', function() {
            const selectedCountry = this.value;
            const langSelect = document.getElementById('lang-select');
            const lang = langSelect ? langSelect.value : 'en';
            const mapping = translations[lang] || translations['en'];
            
            citySelect.innerHTML = '<option value="" id="city-placeholder">' + mapping["city-placeholder"] + '</option>';
            citySelect.disabled = !selectedCountry;
            if (cities[selectedCountry]) {
                cities[selectedCountry].forEach(function(city) {
                    const opt = document.createElement('option');
                    opt.value = city.toLowerCase().replace(/ /g, '-');
                    opt.text = city;
                    citySelect.appendChild(opt);
                });
            }
            // Update display after repopulating cities
            updateLocationDisplay();
        });

        // Update display when city selection changes
        citySelect.addEventListener('change', updateLocationDisplay);

        // Continue button behaviour unchanged
        continueBtn.addEventListener('click', function() {
            const selectedCountry = countrySelect.value;
            const selectedCity = citySelect.value;
            if (!selectedCountry) {
                alert('Please select a country before continuing.');
            } else if (!selectedCity) {
                alert('Please select a city/town before continuing.');
            } else {
                window.location.href = selectedCity + '.html';
            }
        });

        // Initialize display on load (in case the selects are pre-filled)
        document.addEventListener('DOMContentLoaded', function() {
            updateLocationDisplay();
        });
    </script>
</body>
    <footer>
        <p id="footer-text">&copy; 2025 BalticComfort. Blockchain solutions for the hospitality industry.</p>
    </footer>
</html>
