<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Boreal Horizons</title>
  <meta name="description" content="Reset your Boreal Horizons account password">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav class="site-nav" aria-label="Primary navigation">
      <div class="nav-inner">
        <button type="button" class="nav-toggle" aria-expanded="false" aria-controls="site-nav-links">
            <span class="sr-only">Menu</span>
            <span class="nav-toggle__bars" aria-hidden="true"></span>
        </button>

        <div class="nav-containers" id="site-nav-links" role="menubar" aria-label="Site quick links">
          <details class="nav-dropdown nav-dropdown-home" role="none">
            <summary class="nav-box nav-box-home" role="menuitem" aria-haspopup="true" aria-label="Home">Home</summary>
            <div class="nav-dropdown-menu" role="menu">
              <a href="index.html" role="menuitem" class="nav-home-link">Home</a>
              <a href="about-us-and-partners.html" role="menuitem" class="nav-about-partners">About Us and Partners</a>
            </div>
          </details>
          <a class="nav-box nav-box-blog" href="culture-blog.html" role="menuitem" aria-label="Blog">Blog</a>
          <a class="nav-box nav-box-right" href="index.html#contact" role="menuitem" aria-label="Contact us">Contact</a>
        </div>

        <div class="nav-tools">
            <button type="button" class="nav-account-btn" data-login-open aria-haspopup="dialog" aria-controls="login-popup" aria-expanded="false">Login</button>
            <div class="language-switcher" aria-label="Language selector">
          <label for="lang-select">Language</label>
          <div class="language-switcher__select">
            <select id="lang-select" aria-label="Select language">
              <option value="en">English</option>
              <option value="ru">Русский</option>
              <option value="lv">Latviešu</option>
              <option value="et">Eesti</option>
              <option value="de">Deutsch</option>
            </select>
          </div>
        </div>
        </div>

        <ul class="nav-links" aria-hidden="true">
          <li><a href="index.html">Home</a></li>
          <li><a href="about-us-and-partners.html">About Us and Partners</a></li>
          <li><a href="culture-blog.html">Blog</a></li>
          <li><a href="index.html#contact">Contact</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="auth-page" role="main">
    <section class="auth-panel" aria-labelledby="forgot-title">
      <h1 id="forgot-title">Forgot Password</h1>
      <p class="auth-lead">Enter your email and we will send reset instructions if an account exists.</p>
      <p class="auth-status" id="auth-form-status" role="status" aria-live="polite"></p>

      <form id="forgotPasswordForm" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com" />
        </div>

        <div class="auth-actions">
          <button class="btn" type="submit">Send reset instructions</button>
        </div>
      </form>

      <p class="auth-switch"><a href="register.html">Register</a> · <a href="index.html">Back to home</a></p>
    </section>
  </main>

  <footer>
    <small>&copy; Boreal Horizons</small>
  </footer>

  <script src="site-preferences.js"></script>
  <script src="assets/nav-translations.js"></script>
  <script src="assets/nav-rail.js"></script>
  <script src="assets/auth-client.js"></script>
  <script>
    (function() {
      if (window.LanguagePreferences && typeof window.LanguagePreferences.init === 'function') {
        LanguagePreferences.init(document.getElementById('lang-select'));
      }

      document.querySelectorAll('.nav-dropdown').forEach(function(navDropdown) {
        const summary = navDropdown.querySelector('summary');
        const menu = navDropdown.querySelector('.nav-dropdown-menu');
        let closeTimerId = null;

        const syncAriaExpanded = function() {
          if (summary) {
            summary.setAttribute('aria-expanded', navDropdown.hasAttribute('open') ? 'true' : 'false');
          }
        };

        const scheduleClose = function() {
          if (!navDropdown.hasAttribute('open')) return;
          if (closeTimerId) window.clearTimeout(closeTimerId);
          closeTimerId = window.setTimeout(function() {
            navDropdown.removeAttribute('open');
            closeTimerId = null;
          }, 150);
        };

        const cancelClose = function() {
          if (closeTimerId) {
            window.clearTimeout(closeTimerId);
            closeTimerId = null;
          }
        };

        navDropdown.addEventListener('toggle', syncAriaExpanded);
        syncAriaExpanded();
        if (summary) {
          summary.addEventListener('pointerenter', cancelClose);
          summary.addEventListener('pointerleave', scheduleClose);
        }
        if (menu) {
          menu.addEventListener('pointerenter', cancelClose);
          menu.addEventListener('pointerleave', scheduleClose);
        }
        navDropdown.addEventListener('pointerleave', scheduleClose);
        navDropdown.addEventListener('pointerenter', cancelClose);
      });
    })();
  </script>
</body>
</html>
