<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hotel d’Angleterre, Copenhagen</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .hotel-detail {
            max-width: 600px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.09);
            padding: 2rem;
        }
        .hotel-detail img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 0.7rem;
            margin-bottom: 1rem;
        }
        .hotel-detail .price {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }
        .booking-summary {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f1f7f1;
            border-radius: 0.75rem;
            border: 1px solid rgba(46, 125, 50, 0.2);
            color: #2e4d25;
            line-height: 1.6;
        }
        .booking-summary p {
            margin: 0.35rem 0;
        }
        .booking-summary__total {
            font-weight: bold;
            color: #2e7d32;
            font-size: 1.05rem;
        }
        .booking-summary__notice {
            font-weight: 600;
        }
        .booking-summary__reminder a {
            color: #2e7d32;
            font-weight: 600;
            text-decoration: none;
        }
        .booking-summary__reminder a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body style="background:#e6f0e6;min-height:100vh;">
    <div class="booking-header">
        <h1>HotelPaymentSystem</h1>
        <p>Book your stay with secure crypto payments</p>
    </div>
    <div class="hotel-detail">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?fit=crop&w=600&q=80" alt="Hotel d’Angleterre">
        <h2>Hotel d’Angleterre, Copenhagen</h2>
        <div class="price" data-rate-value="0.12" data-rate-currency="ETH" data-rate-decimals="2">0.12 ETH / night</div>
        <p>
            Historic five-star hotel on Kongens Nytorv, with luxury amenities and fine dining.
        </p>
        <div class="booking-summary" aria-live="polite">
            <p class="booking-summary__notice">Loading your booking summary…</p>
        </div>
    </div>
    <script src="assets/hotel-booking-summary.js"></script>
</body>
</html>
